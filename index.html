<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="quicklist: sua lista de compras simples e rápida." />
    <title>Compras da semana | quicklist</title>

    <!-- Fonte Inter (Google Fonts): apenas os pesos usados no Style Guide -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/components.css" />

    <!-- defer: o script roda depois que o HTML for lido, sem bloquear a página -->
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <img src="assets/logo.svg" alt="quicklist" width="156" height="40" />
    </header>

    <main class="container">
      <a href="#" class="back-link"><span aria-hidden="true">←</span> Voltar</a>

      <h1 class="title">Compras da semana</h1>

      <form class="add-item" id="add-item-form">
        <label for="item-input" class="sr-only">Novo item</label>
        <input
          class="input"
          id="item-input"
          name="item"
          type="text"
          placeholder="Adicione um novo item"
          autocomplete="off"
          maxlength="60"
          required
        />
        <button class="button" type="submit">Adicionar item</button>
      </form>

      <!-- Itens de exemplo do Figma: o JS vai renderizar a lista a partir do template abaixo -->
      <ul class="list" id="item-list" aria-label="Itens da lista">
        <li class="item">
          <label class="item-label">
            <input type="checkbox" class="checkbox" />
            <span class="item-name">Pão de forma</span>
          </label>
          <button class="icon-button" type="button" aria-label="Remover Pão de forma">

              <path d="M6.33333 11V7M9.66667 11V7" stroke-linecap="round" stroke="currentColor" />
            </svg>
          </button>
        </li>
        <li class="item">
          <label class="item-label">
            <input type="checkbox" class="checkbox" />
            <span class="item-name">Café preto</span>
          </label>
          <button class="icon-button" type="button" aria-label="Remover Café preto">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13 3.66667L12.5869 10.3501C12.4813 12.0576 12.4285 12.9114 12.0005 13.5253C11.7889 13.8287 11.5165 14.0849 11.2005 14.2773C10.5614 14.6667 9.706 14.6667 7.99513 14.6667C6.28208 14.6667 5.42553 14.6667 4.78603 14.2766C4.46987 14.0838 4.19733 13.8272 3.98579 13.5232C3.55792 12.9084 3.5063 12.0534 3.40307 10.3435L3 3.66667" stroke-linecap="round" stroke="currentColor" />

              <path d="M6.33333 11V7M9.66667 11V7" stroke-linecap="round" stroke="currentColor" />
            </svg>
          </button>
        </li>
        <li class="item">
          <label class="item-label">
            <input type="checkbox" class="checkbox" />
            <span class="item-name">Suco de laranja</span>
          </label>
          <button class="icon-button" type="button" aria-label="Remover Suco de laranja">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13 3.66667L12.5869 10.3501C12.4813 12.0576 12.4285 12.9114 12.0005 13.5253C11.7889 13.8287 11.5165 14.0849 11.2005 14.2773C10.5614 14.6667 9.706 14.6667 7.99513 14.6667C6.28208 14.6667 5.42553 14.6667 4.78603 14.2766C4.46987 14.0838 4.19733 13.8272 3.98579 13.5232C3.55792 12.9084 3.5063 12.0534 3.40307 10.3435L3 3.66667" stroke-linecap="round" stroke="currentColor" />

              <path d="M6.33333 11V7M9.66667 11V7" stroke-linecap="round" stroke="currentColor" />
            </svg>
          </button>
        </li>
        <li class="item">
          <label class="item-label">
            <input type="checkbox" class="checkbox" />
            <span class="item-name">Bolacha</span>
          </label>
          <button class="icon-button" type="button" aria-label="Remover Bolacha">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13 3.66667L12.5869 10.3501C12.4813 12.0576 12.4285 12.9114 12.0005 13.5253C11.7889 13.8287 11.5165 14.0849 11.2005 14.2773C10.5614 14.6667 9.706 14.6667 7.99513 14.6667C6.28208 14.6667 5.42553 14.6667 4.78603 14.2766C4.46987 14.0838 4.19733 13.8272 3.98579 13.5232C3.55792 12.9084 3.5063 12.0534 3.40307 10.3435L3 3.66667" stroke-linecap="round" stroke="currentColor" />

      </ul>

        <button class="alert-close" type="button" aria-label="Fechar aviso">

          </svg>
        </button>
      </div>
    </main>

    <!-- Molde de um item: não aparece na tela; o JS clona e preenche -->
    <template id="item-template">
      <li class="item">
        <label class="item-label">
          <input type="checkbox" class="checkbox" />
          <span class="item-name"></span>
        </label>
        <button class="icon-button" type="button" aria-label="Remover item">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13 3.66667L12.5869 10.3501C12.4813 12.0576 12.4285 12.9114 12.0005 13.5253C11.7889 13.8287 11.5165 14.0849 11.2005 14.2773C10.5614 14.6667 9.706 14.6667 7.99513 14.6667C6.28208 14.6667 5.42553 14.6667 4.78603 14.2766C4.46987 14.0838 4.19733 13.8272 3.98579 13.5232C3.55792 12.9084 3.5063 12.0534 3.40307 10.3435L3 3.66667" stroke-linecap="round" stroke="currentColor" />

    </template>
  </body>
</html>
